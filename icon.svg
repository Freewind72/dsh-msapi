<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="dsh-msapi">
  <title>dsh-msapi</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c203a"/>
      <stop offset="1" stop-color="#0a0b14"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fb0ff"/>
      <stop offset="1" stop-color="#5a78e6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5878ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5878ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="170" fill="url(#glow)"/>

  <!-- stem and flag -->
  <rect x="300" y="128" width="22" height="216" rx="11" fill="#eef2ff"/>
  <path d="M300 128 L300 196 L232 214 L232 146 Z" fill="#eef2ff"/>

  <!-- two note heads -->
  <ellipse cx="215" cy="350" rx="47" ry="36" fill="url(#note)"/>
  <ellipse cx="323" cy="336" rx="47" ry="36" fill="url(#note)"/>

  <!-- waveform -->
  <g fill="#ffffff" opacity="0.42">
    <rect x="150" y="378" width="12" height="46" rx="6"/>
    <rect x="180" y="350" width="12" height="74" rx="6"/>
    <rect x="210" y="366" width="12" height="58" rx="6"/>
    <rect x="240" y="390" width="12" height="34" rx="6"/>
    <rect x="270" y="362" width="12" height="62" rx="6"/>
    <rect x="300" y="380" width="12" height="44" rx="6"/>
  </g>
</svg>
